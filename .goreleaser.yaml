# This is an example .goreleaser.yml file with some sensible defaults.
# Make sure to check the documentation at https://goreleaser.com

# The lines below are called `modelines`. See `:help modeline`
# Feel free to remove those if you don't want/need to use them.
# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

before:
  hooks:
    # You may remove this if you don't use go modules.
    - go mod tidy
    # you may remove this if you don't need go generate
    #- go generate ./...

builds:
  - main: ./cmd/aid
    binary: aid
    env:
      - CGO_ENABLED=0
    # No windows: the daemon transitively imports github.com/hanzoai/cloud/cek,
    # whose keystore lock uses Unix-only syscall.Flock/LOCK_EX, so the windows
    # cross-compile cannot build ("undefined: syscall.Flock"). aid is a server
    # daemon — linux is the deployment target, darwin covers local dev; both build.
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    # web/ (the console SPA) is built ONLY by the Dockerfile's `front` stage — a
    # pnpm build in this Go release job OOM-killed the runner (heap >8GB), so it is
    # intentionally absent here. The binary tarball ships the daemon + its runtime
    # config/data; the full web-serving artifact is the Docker image.
    files:
      - src: 'conf/app.conf'
        dst: './conf/app.conf'
      - src: 'data'
        dst: './data'

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"