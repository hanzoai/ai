services:
  cloud:
    restart: always
    build:
      context: ./
      dockerfile: Dockerfile
      target: standard
    entrypoint: /bin/sh -c './server --createDatabase=true'
    ports:
      - "8000:8000"
    environment:
      RUNNING_IN_DOCKER: "true"
    volumes:
      - ./conf:/conf/
      # SQLite is the default driver; the DB file lives on a persistent
      # volume at the path configured in conf/app.conf (dataSourceName).
      - cloud_data:/data

volumes:
  cloud_data:
