  # ── Rerank (served at POST /v1/rerank) ────────────────────────────────
  # zen-reranker is a bi-encoder reranker: /v1/rerank embeds query+documents via
  # this embedding model (text-embedding-3-large on OpenAI Direct) and ranks by
  # cosine similarity — a real ranked response with no rerank-specific key and no
  # GPU. To add a cross-encoder reranker, seed a Jina/Cohere provider (drop
  # JINA_API_KEY / COHERE_API_KEY into the cloud-api-llm-keys KMS secret) and add
  # a model here routed to it; /v1/rerank proxies native rerank providers directly.
  zen-reranker:
    provider: openai-direct
    upstream: text-embedding-3-large
    owned_by: hanzo
    pricing: { input: 0.13, output: 0.00 }

