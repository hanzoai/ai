  # JINA_API_KEY / COHERE_API_KEY into the cloud-api-llm-keys KMS secret) and add
  # a model here routed to it; /v1/rerank proxies native rerank providers directly.
  zen-reranker:
    provider: openai-direct
    upstream: text-embedding-3-large
    owned_by: hanzo
    pricing: {input: 0.13, output: 0.00}

