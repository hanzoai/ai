# Hanzo Cloud Model Configuration
# This file defines model routing, pricing, and identity prompts.
# In production with live_mode: true, pricing is refreshed from pricing.hanzo.ai.
version: 1

services:
  pricing_url: "https://pricing.hanzo.ai"  # Override: PRICING_SERVICE_URL env var

cache:
  pricing_ttl: "6h"

features:
  live_mode: false       # Set true in production ConfigMap
  premium_gate: true
  starter_credit: 5.00

default_pricing:
  input_per_million: 1.00
  output_per_million: 4.00

models:
  # ── DO-AI models (non-premium, included in free credit) ────────────────

  # OpenAI via DO-AI
  gpt-4o:
    provider: do-ai
    upstream: openai-gpt-4o
    fallbacks:
      - provider: openai-direct
        upstream: gpt-4o
    pricing: { input: 2.50, output: 10.00 }

  gpt-4o-mini:
    provider: do-ai
    upstream: openai-gpt-4o-mini
    fallbacks:
      - provider: openai-direct
        upstream: gpt-4o-mini
    pricing: { input: 0.15, output: 0.60 }

