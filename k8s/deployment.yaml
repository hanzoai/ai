# Persistent volume for the embedded SQLite database (dataSourceName =
# file:/data/hanzo_cloud.db). SQLite is single-writer, single-node: the file
# must live on durable storage that survives pod restarts, and exactly one pod
# may have it open for writes. RWO + do-block-storage-retain matches the sibling
# single-writer KMS volume (infra/k8s/kms/pvc.yaml); -retain keeps the DB if the
# PVC is ever deleted.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cloud-data
  namespace: hanzo
  labels:
    app: cloud-api
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: do-block-storage-retain
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-api
  namespace: hanzo
  labels:
    app: cloud-api
spec:
  # SQLite is single-writer single-node: only one pod may hold the DB file open
  # for writes, and the RWO volume can attach to only one node. Hence replicas:1
  # and a Recreate strategy (the old pod fully terminates — releasing the volume
  # — before the new pod starts), never RollingUpdate which would briefly run two
  # writers / contend the RWO claim.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cloud-api
  template:
    metadata:
      labels:
        app: cloud-api
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: cloud-api
          image: ghcr.io/hanzoai/cloud:1.783.1
          ports:
            - containerPort: 8000
              protocol: TCP
          envFrom:
            - secretRef:
                name: cloud-runtime-secrets
            - secretRef:
                name: cloud-search-config
          env:
            - name: RUNNING_IN_DOCKER
              value: "true"
          volumeMounts:
            - name: config
              mountPath: /conf/app.conf
              subPath: app.conf
            # SQLite DB lives here (dataSourceName = file:/data/hanzo_cloud.db).
            # The PVC mount creates /data; the .db file is created on first open.
            - name: cloud-data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: config
          secret:
            secretName: cloud-api-config
        - name: cloud-data
          persistentVolumeClaim:
            claimName: cloud-data
