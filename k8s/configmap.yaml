apiVersion: v1
kind: Secret
metadata:
  name: cloud-api-config
  namespace: hanzo
type: Opaque
stringData:
  app.conf: |
    appname = hanzo-cloud
    httpport = 8000
    runmode = prod
    SessionOn = true
    copyrequestbody = true
    driverName = sqlite
    # SQLite file on a mounted PVC. DB_DSN/DATABASE_URL env (KMS-managed) overrides this.
    dataSourceName = file:/data/hanzo_cloud.db?cache=shared&_pragma=busy_timeout(10000)&_pragma=journal_mode(WAL)
    dbName = hanzo_cloud
    redisEndpoint =
    isDemoMode = false
    disablePreviewMode = false
    logPostOnly = true
    IAM_URL = "https://hanzo.id"
    IAM_CLIENT_ID = "hanzo-cloud"
    IAM_CLIENT_SECRET = ""
    IAM_ORG = "hanzo"
    IAM_APP_NAME = "hanzo-cloud"
    IAM_REDIRECT_PATH = /callback
    cacheDir = "/tmp/hanzo_cloud_cache"
    isLocalIpDb = false
    publicDomain = ""
    adminDomain = ""
    enableExtraPages = false
    defaultLanguage = "en"
    staticBaseUrl = "https://cdn.hanzo.ai"
    htmlTitle = "Hanzo Cloud"
    faviconUrl = "https://cdn.hanzo.ai/static/favicon.png"
    logoUrl = "https://cdn.hanzo.ai/img/hanzo-cloud-logo.png"
    showGithubCorner = false
    defaultColorPrimary = "#fd4444"
    logConfig = {"adapter":"console"}
    searchHost = http://search.hanzo.svc.cluster.local:7700
    searchApiKey = ""
    vectorHost = http://vector.hanzo.svc.cluster.local:6333
    vectorApiKey = ""
